version: 2

models:
  - name: dim_zones
    description: Taxi zone dimension, one row per TLC zone (265), with placeholders labelled.
    columns:
      - name: zone_id
        description: TLC zone identifier; primary key.
        data_tests:
          - not_null
          - unique
      - name: zone_name
        description: Zone name; "Unknown" for zone 264.
        data_tests:
          - not_null
      - name: borough
        description: Borough; "Unknown" for zone 264 and "Outside of NYC" for zone 265.
        data_tests:
          - not_null
      - name: service_zone
        description: "TLC service zone: Yellow Zone, Boro Zone, Airports, EWR, or N/A for the placeholders."
      - name: is_airport
        description: True for JFK, LaGuardia and Newark airport zones.
      - name: is_unknown_zone
        description: True for the placeholder zones 264 (Unknown) and 265 (Outside of NYC).

  - name: dim_date
    description: Date dimension, one row per day of every month loaded into RAW.
    columns:
      - name: date_day
        description: Calendar date; primary key.
        data_tests:
          - not_null
          - unique
      - name: year_number
        description: Calendar year.
      - name: month_number
        description: Month of the year, 1 to 12.
      - name: month_name
        description: Abbreviated month name (Jan, Feb, ...).
      - name: month_start_date
        description: First day of the month.
      - name: day_of_month
        description: Day of the month, 1 to 31.
      - name: day_of_week_iso
        description: ISO day of week, 1 (Monday) to 7 (Sunday).
      - name: day_name
        description: Abbreviated day name (Mon, Tue, ...).
      - name: week_of_year_iso
        description: ISO week number.
      - name: is_weekend
        description: True for Saturday and Sunday.

  - name: fct_trips
    description: >
      Trip fact, one row per raw yellow taxi trip. Invalid trips are kept and flagged
      (is_valid_trip) so data-quality rates stay measurable; the aggregated marts filter
      to valid trips. Incremental by source file using delete+insert.
    columns:
      - name: trip_key
        description: Surrogate primary key (hash of source file and row number).
        data_tests:
          - not_null
          - unique
      - name: pickup_date
        description: >
          Pickup calendar date; joins to dim_date. Guaranteed to exist in dim_date only
          for valid trips, since invalid ones can carry dates outside the loaded months.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
              config:
                where: "is_valid_trip"
      - name: pickup_hour
        description: Hour of day of the pickup, 0 to 23, New York local time.
      - name: pickup_zone_id
        description: Pickup zone; foreign key to dim_zones.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_zones')
                field: zone_id
      - name: dropoff_zone_id
        description: Dropoff zone; foreign key to dim_zones.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_zones')
                field: zone_id
      - name: vendor_id
        description: "TPEP provider code: 1 Creative Mobile Technologies, 2 Curb Mobility, 6 Myle Technologies, 7 Helix."
      - name: rate_code_id
        description: Final rate code in effect at the end of the trip. Null on Flex Fare records.
      - name: rate_code_name
        description: Rate code decoded from the TLC data dictionary.
      - name: payment_type_id
        description: Numeric code for how the passenger paid (0 to 6).
      - name: payment_type_name
        description: Payment type decoded from the TLC data dictionary.
        data_tests:
          - not_null
      - name: store_and_fwd_flag
        description: Y if the record was held in vehicle memory before being sent to the vendor, else N.
      - name: pickup_at
        description: When the meter was engaged, New York local time.
      - name: dropoff_at
        description: When the meter was disengaged, New York local time.
      - name: trip_duration_minutes
        description: Minutes between pickup and dropoff.
      - name: passenger_count
        description: Driver-entered passenger count. Null on Flex Fare records.
      - name: trip_distance_miles
        description: Trip distance in miles reported by the taximeter.
      - name: fare_amount
        description: Time-and-distance fare from the meter, USD.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
              config:
                severity: warn
      - name: extra_amount
        description: Miscellaneous extras and surcharges, USD.
      - name: mta_tax_amount
        description: MTA tax, USD.
      - name: tip_amount
        description: Credit card tip, USD. Cash tips are not recorded.
      - name: tolls_amount
        description: Total tolls, USD.
      - name: improvement_surcharge_amount
        description: Improvement surcharge, USD.
      - name: congestion_surcharge_amount
        description: NYS congestion surcharge, USD.
      - name: airport_fee_amount
        description: LaGuardia / JFK pickup fee, USD.
      - name: cbd_congestion_fee_amount
        description: MTA Congestion Relief Zone charge, USD (from 2025-01-05).
      - name: total_amount
        description: Total charged to the passenger, USD. Excludes cash tips.
      - name: tip_pct
        description: Tip as a percentage of the fare. Null when the fare is below the 3.00 USD initial charge (min_fare_for_tip_pct), where the ratio is meaningless.
      - name: is_pickup_outside_source_month
        description: True when the pickup time is not inside the month the source file covers.
      - name: is_non_positive_duration
        description: True when dropoff is at or before pickup.
      - name: is_excessive_duration
        description: True when the trip lasts longer than 24 hours.
      - name: is_negative_amount
        description: True when fare or total is negative.
      - name: is_fare_outlier
        description: True when the fare exceeds 1,000 USD.
      - name: is_distance_outlier
        description: True when the distance exceeds 100 miles.
      - name: is_zero_distance
        description: True when the meter reported zero miles (informational).
      - name: is_unknown_zone
        description: True when pickup or dropoff is a placeholder zone (informational).
      - name: is_valid_trip
        description: True when no invalidating flag is set.
        data_tests:
          - not_null
      - name: source_month
        description: First day of the month the source file covers.
      - name: source_file
        description: Parquet file the row came from; the unit of incremental replacement.
        data_tests:
          - not_null
      - name: batch_id
        description: Pipeline run that loaded the row; joins to RAW.ETL_RUN_LOG.
      - name: loaded_at
        description: When the row was loaded into RAW; drives the incremental filter.

  - name: agg_daily_trips_weather
    description: >
      One row per calendar day: valid-trip volume, revenue and averages alongside that
      day's weather. Weather data by Open-Meteo.com.
    columns:
      - name: date_day
        description: Calendar date; primary key.
        data_tests:
          - not_null
          - unique
      - name: day_name
        description: Abbreviated day name.
      - name: is_weekend
        description: True for Saturday and Sunday.
      - name: trip_count
        description: Number of valid trips picked up that day.
        data_tests:
          - not_null
      - name: total_revenue
        description: Sum of total_amount for valid trips, USD.
      - name: avg_fare_amount
        description: Mean fare of valid trips, USD.
      - name: avg_trip_distance_miles
        description: Mean distance of valid trips, miles.
      - name: avg_trip_duration_minutes
        description: Mean duration of valid trips, minutes.
      - name: avg_card_tip_pct
        description: Mean tip percentage on credit card trips (the only ones with recorded tips).
      - name: temperature_mean_c
        description: Mean air temperature, degrees Celsius.
      - name: temperature_min_c
        description: Minimum air temperature, degrees Celsius.
      - name: temperature_max_c
        description: Maximum air temperature, degrees Celsius.
      - name: precipitation_mm
        description: Total precipitation, millimetres.
      - name: snowfall_cm
        description: Snowfall, centimetres.
      - name: wind_speed_max_kmh
        description: Maximum wind speed, km/h.
      - name: is_rainy_day
        description: True when precipitation was at least 1 mm.
        data_tests:
          - not_null
      - name: is_snowy_day
        description: True when any snowfall was recorded.

  - name: agg_zone_performance
    description: One row per pickup zone per month, for valid trips, with a volume rank within the month.
    columns:
      - name: zone_month_key
        description: Surrogate primary key (hash of pickup zone and month).
        data_tests:
          - not_null
          - unique
      - name: pickup_zone_id
        description: Pickup zone; foreign key to dim_zones.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_zones')
                field: zone_id
      - name: zone_name
        description: Pickup zone name.
      - name: borough
        description: Pickup borough.
      - name: service_zone
        description: TLC service zone of the pickup zone.
      - name: month_start_date
        description: First day of the month.
      - name: trip_count
        description: Number of valid trips picked up in the zone that month.
      - name: total_revenue
        description: Sum of total_amount, USD.
      - name: avg_fare_amount
        description: Mean fare, USD.
      - name: avg_trip_distance_miles
        description: Mean distance, miles.
      - name: avg_trip_duration_minutes
        description: Mean duration, minutes.
      - name: avg_card_tip_pct
        description: Mean tip percentage on credit card trips.
      - name: card_payment_pct
        description: Share of trips paid by credit card, percent.
      - name: trip_count_rank_in_month
        description: Rank of the zone by trip count within the month (1 = busiest).
