[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["dbt/dbt_packages", "dbt/target"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S"]
ignore = [
    "S608", # SQL is built from validated identifiers, never from user-supplied values
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
